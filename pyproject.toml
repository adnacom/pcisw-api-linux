[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adnacom-monitor"
dynamic = ["version"]
description = "SDK for monitoring and diagnosing Adnacom PCIe host adapters"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "cjonesii", email = "cjonesii@example.com"},
]
maintainers = [
    {name = "cjonesii", email = "cjonesii@example.com"},
]
keywords = ["pcie", "monitoring", "gtk", "hardware", "diagnostics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
dependencies = [
    # PyGObject is required for GUI but optional for testing
]

[tool.setuptools.dynamic]
version = {attr = "adnacom_monitor._version.__version__"}

[project.optional-dependencies]
dev = [
    "black>=22.0.0",
    "build>=0.8.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "twine>=4.0.0",
]
gui = [
    # <3.52 because PyGObject 3.52+ needs girepository-2.0, absent on Ubuntu 22.04
    "pycairo>=1.16.0",
    "PyGObject>=3.42.0,<3.52",
]
build = [
    "build>=0.8.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/cjonesii/adnacom_monitor_sdk"
Repository = "https://github.com/cjonesii/adnacom_monitor_sdk"
Issues = "https://github.com/cjonesii/adnacom_monitor_sdk/issues"

[project.scripts]
adnacom-monitor = "adnacom_monitor.adnacom_monitor:main"

[tool.setuptools]
packages = ["adnacom_monitor"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
adnacom_monitor = ["*.so", "*.svg", "*.png", "*.desktop"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | adnacom-venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
exclude = ['^build/', '^dist/', '^adnacom-venv/']
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "gi.*",
    "cairo",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "adnacom_monitor.Protocol",
    "adnacom_monitor.firmware",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "adnacom_monitor.adnacom_monitor",
    "adnacom_monitor.QSFP_monitor",
    "adnacom_monitor.DIP_switch",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
